<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahil Ali, Operations Analyst</title>
<meta name="description" content="Shaikh Sahil Ali, Operations Analyst at SciAstra. Power BI, SQL, Excel, Python. Launch the mission.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js");</script>
<style>
/* Hallmark · v2.0.0 · audit and fix of an existing build, skills named by the owner · genre: atmospheric · theme: custom, one amber signal on a tinted void, Space Grotesk over Archivo, JetBrains Mono for figures and readouts · signature: a dot-matrix planet whose satellites are the stops of a flown tour · material real: name, role, SciAstra, 2.7 years, email, LinkedIn · absent: projects, quotes, metrics (sections hide until given) */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R3 V4 · weakest: R, launch plus tour plus alert plus sound is a lot; kept because the owner asked for crazy, and paid for it by cutting eyebrows, emoji, status dots and tracked capitals */
/* Hallmark · dismissed 29 · the scrim blur only appears behind an open section, it marks the page as dismissible */
/* Hallmark · dismissed 29 · the red inset vignette only exists during the anomaly alert, it is the alarm state itself */

/* ============ TOKENS ============ */
:root{
  --void:#040609; --bg:#06080c; --bg2:#0b0f16; --panel:#0e131b; --panel2:#141a24;
  --line:#1e2733; --line2:#2a3542;
  --ink:#e8edf3; --ink2:#a9b4c0; --muted:#7c8896;
  --amber:#ffb020; --amber-2:#ffc554; --on-amber:#1c1200;
  --green:#3ddc97; --red:#ff5d5d; --on-red:#1d0606; --alert-bg:#1a0709;
  --flash:#fff7e8; --shadow:rgb(2 3 6 / .72); --scrim:rgb(3 5 8 / .62);
  --veil:color-mix(in oklab, var(--bg) 82%, transparent);
  --amber-soft:color-mix(in oklab, var(--amber) 14%, transparent);
  --amber-line:color-mix(in oklab, var(--amber) 55%, transparent);
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'Archivo',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:clip}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:14px/1.5 var(--mono);color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:12px;width:100%;outline:none}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;transition:none}
h1,h2{text-wrap:balance;overflow-wrap:break-word;min-width:0}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fig{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============ NO-SCRIPT FALLBACK ============ */
.static{max-width:640px;margin:0 auto;padding:64px 24px}
.static h1{font:700 48px/1.05 var(--display)}
.static p{color:var(--ink2);margin-top:12px}

/* ============ CURSOR (mouse only) ============ */
#cur,#ring{position:fixed;left:0;top:0;pointer-events:none;z-index:3000;border-radius:50%;display:none}
#cur{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--amber)}
#ring{width:64px;height:64px;margin:-32px 0 0 -32px;border:1px solid var(--amber-line)}
body.fine #cur,body.fine #ring{display:block}
body.fine,body.fine *{cursor:none!important}

/* ============ LAUNCH ============ */
#boot{display:none}
.js #boot{position:fixed;inset:0;z-index:999;background:var(--void);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 32px;font:14px/1.8 var(--mono);color:var(--green);transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}
#boot > *{position:relative;z-index:1}
#boot #warp{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#boot .hide{opacity:0;pointer-events:none;transition:opacity .3s}
#bootlog{text-align:left}
.js #boot .ln{opacity:0}
#boot .ln.on{opacity:1}
#boot .ln .ok{color:var(--amber)}
#launchRow{margin-top:32px;opacity:0;transition:opacity .5s}
#launchRow.on{opacity:1}
#launch{position:relative;width:152px;height:152px;border-radius:50%;border:1px solid var(--amber);color:var(--amber);font:600 16px/1.3 var(--body);background:var(--amber-soft);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:background-color .2s,color .2s,transform .2s}
#launch .i{width:32px;height:32px}
#launch::before,#launch::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid var(--amber-line);animation:ping 2s infinite}
#launch::after{animation-delay:1s}
@keyframes ping{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
#launch:hover{background:var(--amber);color:var(--on-amber);transform:scale(1.04)}
#launch:active{transform:scale(.97)}
#launchRow p{margin-top:24px;color:var(--ink2);font:14px var(--body);display:flex;gap:8px;align-items:center;justify-content:center}
#skip{position:absolute!important;right:20px;bottom:16px;color:var(--muted);font:13px var(--body)}
#count{position:absolute!important;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ink)}
#count div{font:700 min(38vw,300px)/1 var(--mono);font-variant-numeric:tabular-nums;animation:pop .45s ease-out}
#count small{display:block;font:500 16px var(--body);color:var(--amber);margin-bottom:12px}
#count .lift{font:700 min(16vw,148px)/1 var(--display);color:var(--amber)}
@keyframes pop{from{transform:scale(1.35);opacity:0}}
#boot.shake{animation:shake .07s infinite}
@keyframes shake{0%{transform:translate(3px,-3px)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,4px)}75%{transform:translate(-3px,-2px)}}
#flash{position:fixed;inset:0;background:var(--flash);opacity:0;pointer-events:none;z-index:1000}

/* ============ STAGE ============ */
#os{position:fixed;inset:0}
#os::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/56px 56px;
  opacity:.35;mask-image:radial-gradient(ellipse at center,var(--ink) 20%,transparent 80%)}
#orbit{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}
.topbar{position:absolute;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;gap:16px;height:48px;padding:0 20px;font:14px var(--body);color:var(--ink2)}
.wordmark{font:700 18px var(--display);color:var(--ink);letter-spacing:-.01em}
.topbar .sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;color:var(--ink2);background:var(--panel);transition:color .2s,border-color .2s}
.tbtn:hover{color:var(--amber);border-color:var(--amber)}
.tbtn:active{transform:translateY(1px)}

.hero{position:absolute;z-index:2;right:max(24px,6vw);top:50%;transform:translateY(-56%);width:min(560px,48vw);pointer-events:none;transition:opacity .5s}
.hero .cta{pointer-events:auto}
.hero h1{font:700 clamp(48px,6.6vw,92px)/.95 var(--display);letter-spacing:-.035em;margin:0 0 16px}
.hero h1 .ch{display:inline-block;will-change:transform}
.hero .role{font:600 20px var(--display);color:var(--amber)}
.hero p{color:var(--ink2);font-size:17px;max-width:44ch;margin-top:8px}
.telemetry{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:24px 0}
.telemetry div{background:var(--veil);padding:16px}
.telemetry b{display:block;font:600 26px var(--mono);font-variant-numeric:tabular-nums}
.telemetry small{font:13px var(--body);color:var(--muted)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:12px 20px;font:600 15px var(--body);background:var(--panel);text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s,color .15s,background-color .15s}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--amber);color:var(--on-amber);border-color:var(--amber);box-shadow:0 8px 24px -8px var(--shadow)}
.btn.pri:hover{background:var(--amber-2);color:var(--on-amber)}

.js #hint{position:absolute;z-index:2;left:30%;bottom:104px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font:14px var(--body);color:var(--ink2);padding:8px 16px;border:1px dashed var(--line2);border-radius:999px;background:var(--veil);pointer-events:none;animation:bob 2.4s ease-in-out infinite;transition:opacity .5s}
#hint.off{opacity:0}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
#satlabel{position:absolute;z-index:3;pointer-events:none;transform:translate(16px,-50%);background:var(--panel);border:1px solid var(--amber);border-radius:12px;padding:8px 12px;font:13px var(--body);color:var(--ink2);transition:opacity .15s;white-space:nowrap}
.js #satlabel{opacity:0}
#satlabel b{display:block;color:var(--ink);font:600 15px var(--display)}
#satlabel span{color:var(--amber)}

.nav{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:400;display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);transition:opacity .5s}
.nav button{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;font:600 14px var(--body);color:var(--ink2);white-space:nowrap;transition:background-color .2s,color .2s}
.nav button:hover{color:var(--ink);background:var(--panel2)}
.nav button:active{transform:translateY(1px)}
.nav button.act{background:var(--amber);color:var(--on-amber)}

/* ============ PANEL ============ */
#scrim{position:fixed;inset:0;z-index:600;background:var(--scrim);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
#scrim.on{opacity:1;pointer-events:auto}
#panel{position:fixed;left:50%;top:50%;z-index:610;width:min(780px,94vw);max-height:min(80vh,740px);display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:20px;opacity:0;pointer-events:none;transform:translate(-50%,-44%) scale(.94);transition:opacity .3s,transform .5s cubic-bezier(.2,1.25,.3,1)}
#panel.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#panel::before{content:"";position:absolute;left:32px;right:32px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}
#panel header{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 24px;border-bottom:1px solid var(--line)}
#panel .pt{flex:1;display:flex;align-items:center;gap:8px;font:600 15px var(--body);color:var(--amber)}
.pbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink2);transition:color .2s,border-color .2s}
.pbtn:hover{border-color:var(--amber);color:var(--amber)}
.pbtn:active{transform:scale(.96)}
.pbtn[hidden]{display:none}
#panel .body{overflow:auto;padding:28px 28px 32px}
#panel .body.in > *{animation:rise .55s both}
#panel .body.in > *:nth-child(2){animation-delay:.05s}#panel .body.in > *:nth-child(3){animation-delay:.1s}#panel .body.in > *:nth-child(4){animation-delay:.15s}#panel .body.in > *:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

h2{font:700 32px/1.15 var(--display);letter-spacing:-.02em;margin:0 0 12px}
h3{font:600 17px var(--display)}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:13px var(--body);border:1px solid var(--line2);border-radius:20px;padding:4px 12px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:12px}
.card{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:transform .2s,border-color .2s;text-align:left;display:block;width:100%}
button.card:hover{border-color:var(--amber);transform:translateY(-3px)}
button.card:active{transform:translateY(0)}
.card .n{font:13px var(--body);color:var(--muted)}
.card .metric{font:600 22px var(--mono);font-variant-numeric:tabular-nums;color:var(--amber);margin:8px 0 4px}
.card .i{width:24px;height:24px;color:var(--amber)}
.bigmetric{font:600 40px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--amber);margin:4px 0 16px}
.steps{list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.steps li::before{content:counter(s,decimal-leading-zero);font:600 15px var(--mono);color:var(--amber)}
.steps p{color:var(--ink2);font-size:15px;margin-top:4px}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--amber),var(--line2))}
.tl .it{position:relative;margin-bottom:24px}
.tl .it::before{content:"";position:absolute;left:-23px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--amber)}
.tl ul{margin:8px 0 0 20px;color:var(--ink2)}
.quote{border-left:2px solid var(--amber);padding:4px 0 4px 16px;margin-bottom:24px}
.quote p{font-size:17px}
.quote small{display:block;margin-top:8px;font:14px var(--body);color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.back{display:inline-flex;align-items:center;gap:4px;font:14px var(--body);color:var(--muted);margin-bottom:12px}
.back:hover{color:var(--amber)}
.out{white-space:pre-wrap;word-break:break-word;font:13px/1.6 var(--mono);background:var(--void);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:60px;color:var(--ink2)}
.out.err{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;margin-top:12px}
.stats div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px}
.stats b{display:block;font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.stats small{font:13px var(--body);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;margin:12px 0 20px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi small{font:13px var(--body);color:var(--muted)}
.kpi b{display:block;font:600 26px var(--mono);font-variant-numeric:tabular-nums;margin:4px 0}
.kpi .d{font:13px var(--body);color:var(--ink2)}
.kpi .d i{font-style:normal;color:var(--green)}
.chartbox{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.chartbox svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:4px 8px;font:13px var(--body);white-space:nowrap;transition:opacity .1s;transform:translate(-50%,-110%)}
.js .tip{opacity:0}
table{width:100%;border-collapse:collapse;font:13px var(--mono);margin-top:12px}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right}
th{color:var(--muted);font:400 13px var(--body)}
.term{background:var(--void);font:14px/1.6 var(--mono);color:var(--green);height:340px;padding:16px;overflow:auto;border-radius:12px;border:1px solid var(--line)}
.term .in{display:flex;gap:8px}
.term input{background:none;border:0;padding:0;color:var(--ink);flex:1}
.term .p{color:var(--amber)}
.term .o{color:var(--ink2);white-space:pre-wrap;margin-bottom:8px}

/* ============ TOUR ============ */
#cap{position:fixed;left:50%;bottom:88px;z-index:550;width:min(680px,92vw);text-align:center;transform:translate(-50%,24px);transition:opacity .5s,transform .6s cubic-bezier(.2,1.2,.3,1);pointer-events:none}
.js #cap{opacity:0}
#cap.on{opacity:1;transform:translate(-50%,0)}
#cap h2{font-size:clamp(32px,4.4vw,52px);margin:0 0 4px}
#cap .bigmetric{font-size:clamp(28px,4vw,48px);margin:4px 0 8px}
#cap p{color:var(--ink2);font-size:17px}
#cap .row{justify-content:center;pointer-events:auto;margin-top:20px}
#tourbar{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:550;display:none;gap:8px}
#tourbar i{width:28px;height:4px;border-radius:4px;background:var(--line2);overflow:hidden;position:relative}
#tourbar i.done{background:var(--amber)}
#tourbar i.now::after{content:"";position:absolute;inset:0;background:var(--amber);transform-origin:left;animation:fill var(--d,3.4s) linear forwards}
@keyframes fill{from{transform:scaleX(0)}}
#tourX{position:fixed;top:56px;right:20px;z-index:560;display:none}
body.touring #tourX,body.touring #tourbar{display:flex}
body.touring .hero,body.touring .nav,body.touring #hint{opacity:0;pointer-events:none}
body.touring .hero .cta{pointer-events:none}

/* ============ PALETTE / TOAST / ALERT ============ */
#pal{position:fixed;inset:0;z-index:900;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;padding-top:14vh}
#pal.on{display:flex}
#pal .box{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden}
#pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 20px;font:16px var(--body);background:transparent}
#pal ul{list-style:none;max-height:50vh;overflow:auto;padding:8px}
#pal li{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink2)}
#pal li.sel{background:var(--amber-soft);color:var(--ink)}
#pal li span:last-child{margin-left:auto;font:13px var(--body);color:var(--muted)}
#toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--amber);padding:8px 16px;border-radius:999px;font:14px var(--body);z-index:950;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.js #toast{opacity:0}
#toast.on{opacity:1}
#alert{position:fixed;left:50%;top:56px;transform:translate(-50%,-200%);z-index:800;width:min(540px,92vw);background:var(--alert-bg);border:1px solid var(--red);border-radius:16px;padding:16px 20px;transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
#alert.on{transform:translate(-50%,0)}
#alert .h{display:flex;gap:8px;align-items:center;color:var(--red);font:700 18px var(--display);animation:blink .6s steps(2) infinite}
#alert p{margin:8px 0 4px;font-size:16px}
#alert .pr{font:14px var(--body);color:var(--muted)}
#alert .btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
@keyframes blink{50%{opacity:.4}}
#os.redalert::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px color-mix(in oklab, var(--red) 40%, transparent);animation:blink 1s infinite;z-index:450}

/* ============ MOBILE ============ */
@media (max-width:760px){
  .topbar{padding:0 16px}#clock{display:none}
  .hero{left:20px;right:20px;width:auto;top:64px;transform:none}
  .hero p{font-size:16px}
  .telemetry{margin:20px 0}.telemetry b{font-size:20px}
  .js #hint{left:50%;bottom:96px}
  .nav{left:12px;right:12px;transform:none;overflow-x:auto;border-radius:20px;scrollbar-width:none}
  .nav button{padding:12px;font-size:14px;flex:none}
  #panel{left:0;top:0;width:100%;height:100%;max-height:none;border-radius:0;transform:translateY(24px)}
  #panel.on{transform:none}
  #panel .body{padding:24px 20px 40px}
  h2{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript><div class="static"><h1>Shaikh Sahil Ali</h1><p>Operations Analyst at SciAstra. <a href="resume.pdf">Download résumé</a></p><p>Email: <a href="mailto:sksahilali003@gmail.com">sksahilali003@gmail.com</a></p></div></noscript>
<div id="cur"></div><div id="ring"></div>

<div id="boot" role="dialog" aria-label="Launch">
  <canvas id="warp" aria-hidden="true"></canvas>
  <div id="bootlog"></div>
  <div id="launchRow">
    <button id="launch"></button>
    <p id="soundNote"></p>
  </div>
  <div id="count" aria-live="polite"></div>
  <button id="skip">Skip</button>
</div>
<div id="flash"></div>

<div id="os">
  <canvas id="orbit" aria-hidden="true"></canvas>

/* =====================================================================
   SOUND — always on after the first tap (browsers block sound before it)
   ===================================================================== */
const SFX = {
  ctx:null, master:null, amb:false,
  unlock(){
    if (!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); this.master=this.ctx.createGain(); this.master.gain.value=.9; this.master.connect(this.ctx.destination); }catch{ return; } }
    if (this.ctx.state!=="running") this.ctx.resume();
    if (!this.amb){ this.amb=true; this.ambient(); }
  },
  ok(){ return this.ctx && this.ctx.state==="running"; },
  tone(f,d=.1,v=.05,type="sine",f2){
    if(!this.ok()) return; const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+d+.02);
  },
  noise(d,v,f1,f2){
    if(!this.ok()) return; const c=this.ctx,t=c.currentTime,len=Math.floor(c.sampleRate*d);
    const buf=c.createBuffer(1,len,c.sampleRate),a=buf.getChannelData(0); for(let i=0;i<len;i++) a[i]=Math.random()*2-1;
    const src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(); src.buffer=buf; fl.type="bandpass"; fl.Q.value=1.2;
    fl.frequency.setValueAtTime(f1,t); fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+d*.3); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    src.connect(fl).connect(g).connect(this.master); src.start(t);
  },
  ambient(){
    const c=this.ctx,g=c.createGain(),lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=420;
    g.gain.setValueAtTime(0,c.currentTime); g.gain.linearRampToValueAtTime(.06,c.currentTime+5);
    [[55,"sine",.5],[55.35,"sine",.5],[82.4,"triangle",.18],[110.2,"sine",.08]].forEach(([f,type,v])=>{ const o=c.createOscillator(),og=c.createGain(); o.type=type; o.frequency.value=f; og.gain.value=v; o.connect(og).connect(lp); o.start(); });
    const lfo=c.createOscillator(),lg=c.createGain(); lfo.frequency.value=.07; lg.gain.value=.025; lfo.connect(lg).connect(g.gain); lfo.start();
    lp.connect(g).connect(this.master);
  },
  hover(){ this.tone(2200,.03,.012); },
  open(){ this.noise(.45,.05,500,3000); this.tone(520,.25,.03,"sine",1040); },
  close(){ this.noise(.35,.04,2500,400); this.tone(800,.2,.025,"sine",400); },
  whoosh(){ this.noise(.9,.08,300,2600); },
  ping(){ this.tone(1320,.5,.018,"sine",1250); },
  beep(f=880){ this.tone(f,.1,.06,"square"); },
  rumble(d=2.6){
    if(!this.ok()) return; const c=this.ctx,t=c.currentTime,len=Math.floor(c.sampleRate*(d+1.5));
    const buf=c.createBuffer(1,len,c.sampleRate),a=buf.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ last=(last+.02*(Math.random()*2-1))/1.02; a[i]=last*3.5; }
    const src=c.createBufferSource(),lp=c.createBiquadFilter(),g=c.createGain(); src.buffer=buf; lp.type="lowpass"; lp.frequency.value=160;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.9,t+d); g.gain.exponentialRampToValueAtTime(.0001,t+d+1.4);
    src.connect(lp).connect(g).connect(this.master); src.start(t);
  },
  siren(){
    if(!this.ok()) return; const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
    o.type="sawtooth"; lp.type="lowpass"; lp.frequency.value=1800;
    for(let k=0;k<3;k++){ o.frequency.setValueAtTime(520,t+k*.55); o.frequency.linearRampToValueAtTime(900,t+k*.55+.45); }
    g.gain.setValueAtTime(.04,t); g.gain.setValueAtTime(.04,t+1.55); g.gain.exponentialRampToValueAtTime(.0001,t+1.7);
    o.connect(lp).connect(g).connect(this.master); o.start(t); o.stop(t+1.75);
  },
};
["pointerdown","keydown","touchstart"].forEach(ev => addEventListener(ev, ()=>SFX.unlock(), {passive:true, capture:true}));
document.addEventListener("visibilitychange", ()=>{ if(SFX.ctx) document.hidden ? SFX.ctx.suspend() : SFX.ctx.resume(); });
document.addEventListener("pointerover", e=>{ const b=e.target.closest("button,a"); if(b && !b.contains(e.relatedTarget)) SFX.hover(); });

/* =====================================================================
   EFFECTS — cursor, text scramble, count-up, magnetic name
   ===================================================================== */
const FINE = matchMedia("(pointer: fine)").matches;
let MX=-999, MY=-999;
addEventListener("pointermove", e=>{ MX=e.clientX; MY=e.clientY; });
if (FINE && !REDUCED){
  document.body.classList.add("fine");
  const cur=$("#cur"), ring=$("#ring"); let rx=innerWidth/2, ry=innerHeight/2, rs=.56, big=false;
  addEventListener("pointermove", e=>{ cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;
    big = !!e.target.closest?.("button,a,input,textarea") || e.target.style?.cursor==="pointer"; });
  (function f(){ rx+=(MX-rx)*.18; ry+=(MY-ry)*.18; rs+=((big?1:.56)-rs)*.2;
    ring.style.transform=`translate(${rx}px,${ry}px) scale(${rs})`; requestAnimationFrame(f); })();
}
function scramble(el, dur=700){
  const txt = el.dataset.txt || (el.dataset.txt = el.textContent);
  if (REDUCED) { el.textContent = txt; return; }
  const ch="!<>_/[]{}=+*^?#01ABCDEFXZ", t0=performance.now();
  (function f(t){ const k=Math.min(1,(t-t0)/dur), n=Math.floor(txt.length*k);
    el.textContent = txt.slice(0,n) + [...txt.slice(n)].map(c=>c===" "?" ":ch[Math.random()*ch.length|0]).join("");
    if (k<1) requestAnimationFrame(f); else el.textContent=txt; })(t0);
}
function countUp(el){
  const raw = el.dataset.v || (el.dataset.v = el.textContent), m = raw.match(/^([^\d]*)([\d.,]+)(.*)$/);
  if (!m || REDUCED) return; const target=parseFloat(m[2].replace(/,/g,"")), dec=(m[2].split(".")[1]||"").length, t0=performance.now();
  (function f(t){ const k=Math.min(1,(t-t0)/1400), e=1-Math.pow(1-k,3);
    el.textContent = m[1] + (target*e).toLocaleString("en-IN",{minimumFractionDigits:dec,maximumFractionDigits:dec}) + m[3];
    if (k<1) requestAnimationFrame(f); else el.textContent=raw; })(t0);
}
// letters of your name drift away from the cursor
function magnetize(h1){
  if (!FINE || REDUCED) return;
  h1.querySelectorAll(".nm").forEach(line=>{ line.innerHTML=[...line.textContent].map(c=>`<span class="ch">${c===" "?"&nbsp;":esc(c)}</span>`).join(""); });
  const chars=[...h1.querySelectorAll(".ch")].map(el=>({el,x:0,y:0,cx:0,cy:0}));
  const measure=()=>chars.forEach(c=>{ const r=c.el.getBoundingClientRect(); c.cx=r.left+r.width/2-c.x; c.cy=r.top+r.height/2-c.y; });
  measure(); addEventListener("resize",measure);
  (function f(){
    for(const c of chars){ const dx=c.cx-MX, dy=c.cy-MY, d=Math.hypot(dx,dy), R=140;
      const p = d<R ? (1-d/R) : 0, tx = p ? dx/d*p*26 : 0, ty = p ? dy/d*p*26 : 0;
      c.x+=(tx-c.x)*.15; c.y+=(ty-c.y)*.15;
      c.el.style.transform=`translate(${c.x.toFixed(2)}px,${c.y.toFixed(2)}px)`;
      c.el.style.color = p>.2 ? "var(--amber)" : ""; }
    requestAnimationFrame(f); })();
}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),1900); }
function copy(t,msg){ navigator.clipboard?.writeText(t).then(()=>toast(msg||"Copied"),()=>toast("Copy failed")); }

const panel=$("#panel"), scrim=$("#scrim"), pbody=panel.querySelector(".body"), ptitle=panel.querySelector(".pt");

let cur=null, curList=null;
function openApp(id, list){
  const app=APPS[id]; if(!app) return;

  curList = list || (NAV.includes(id) ? NAV : app.project!=null ? PROJECT_IDS : null);

  pbody.scrollTop=0; pbody.classList.remove("in"); void pbody.offsetWidth; pbody.classList.add("in");

}

/* =====================================================================
   TOUR — one tap, flies to every stop
   ===================================================================== */
let touring=false, tourRun=0;
const cap=$("#cap"), tbar=$("#tourbar");
async function tour(){
  if (touring) return; closePanel(); touring=true; const run=++tourRun;
  document.body.classList.add("touring"); $("#hint").classList.add("off");
  const N=STOPS.length, HOLD=3400;
  tbar.innerHTML = STOPS.map(()=>"<i></i>").join(""); tbar.style.setProperty("--d", HOLD/1000+"s");
  cap.innerHTML = `<h2>${HAS.projects?`${N} projects, one quick flight.`:`Meet ${esc(FIRST)}.`}</h2>`; cap.classList.add("on"); SFX.whoosh();
  await wait(1400); if (run!==tourRun) return;
  for (let i=0;i<N;i++){
    const m=STOPS[i];
    cap.classList.remove("on"); SFX.whoosh();
    await ORBIT.focus(i, 1.3); if (run!==tourRun) return;
    [...tbar.children].forEach((b,j)=>{ b.className = j<i ? "done" : j===i ? "now" : ""; });
    cap.innerHTML = `<h2>${esc(m.name)}</h2>${m.metric?`<div class="bigmetric">${esc(m.metric)}</div>`:""}<p>${esc(m.summary)}</p>`;
    cap.classList.add("on"); scramble(cap.querySelector("h2"),600); SFX.tone(660,.18,.04,"sine",990);
    await wait(HOLD); if (run!==tourRun) return;
  }
  cap.classList.remove("on"); [...tbar.children].forEach(b=>b.className="done");
  await ORBIT.home(1.6); if (run!==tourRun) return;
  cap.innerHTML = `<h2>${HAS.projects?"That's the highlight reel.":"Thanks for flying by."}</h2><p>Want to work together?</p>
    <div class="row"><button class="btn pri" data-open="contact">${ic("mail")}Let's talk</button>${HAS.projects?`<button class="btn" data-open="projects">All projects</button>`:`<button class="btn" data-open="about">About me</button>`}<button class="btn" id="tourAgain">Replay</button></div>`;
  cap.classList.add("on"); SFX.tone(523,.2,.05); setTimeout(()=>SFX.tone(784,.35,.05),160);
  $("#tourAgain").onclick = ()=>{ endTour(); tour(); };
}
function endTour(keepCam){
  if (!touring) return; touring=false; tourRun++;
  document.body.classList.remove("touring"); cap.classList.remove("on");
  if (!keepCam) ORBIT.home();
}
$("#tourX").innerHTML = `${ic("x")}Exit tour`;
$("#tourX").onclick = ()=>endTour();

/* =====================================================================
   3D ORBIT — planet, signal pulses, one satellite per stop
   ===================================================================== */
const ORBIT = { focus:()=>wait(300), home:()=>Promise.resolve() };
function initOrbit(){
  if (!window.THREE) return;
  const cv=$("#orbit"), label=$("#satlabel");
  let renderer; try{ renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}); }catch{ return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  const AMBER=new THREE.Color(tok("--amber")), INK=new THREE.Color(tok("--ink")), LINE=new THREE.Color(tok("--line2")), BG=new THREE.Color(tok("--bg")), INK2=new THREE.Color(tok("--ink2"));
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(42,1,.1,200);
  const HOME=new THREE.Vector3(0,1.6,8.2), ORIGIN=new THREE.Vector3(), look=new THREE.Vector3(); cam.position.copy(HOME);
  const world=new THREE.Group(); scene.add(world);
  const tilt=new THREE.Group(); tilt.rotation.z=-.18; world.add(tilt);

  const N=3200, R=1.6, p=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const y=1-(i/(N-1))*2, r=Math.sqrt(1-y*y), th=i*2.39996; p[i*3]=Math.cos(th)*r*R; p[i*3+1]=y*R; p[i*3+2]=Math.sin(th)*r*R; }
  const pg=new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(p,3));
  const planet=new THREE.Group();
  planet.add(new THREE.Points(pg,new THREE.PointsMaterial({color:AMBER,size:.028,transparent:true,opacity:.9})));
  planet.add(new THREE.Mesh(new THREE.SphereGeometry(R*.985,48,48),new THREE.MeshBasicMaterial({color:BG})));
  tilt.add(planet);

  const amberRGB=`${AMBER.r*255|0},${AMBER.g*255|0},${AMBER.b*255|0}`;
  const gc=document.createElement("canvas"); gc.width=gc.height=256; const gx=gc.getContext("2d");
  const grd=gx.createRadialGradient(128,128,60,128,128,128); grd.addColorStop(0,`rgba(${amberRGB},.35)`); grd.addColorStop(.5,`rgba(${amberRGB},.08)`); grd.addColorStop(1,`rgba(${amberRGB},0)`);
  gx.fillStyle=grd; gx.fillRect(0,0,256,256); const glowTex=new THREE.CanvasTexture(gc);
  const atmo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,depthWrite:false,blending:THREE.AdditiveBlending})); atmo.scale.set(R*4.2,R*4.2,1); scene.add(atmo);

  // signal pulses: rings that ripple out from the planet, like data coming in
  const rc=document.createElement("canvas"); rc.width=rc.height=256; const rx=rc.getContext("2d");
  rx.strokeStyle=`rgba(${amberRGB},1)`; rx.lineWidth=3; rx.beginPath(); rx.arc(128,128,124,0,Math.PI*2); rx.stroke();
  const ringTex=new THREE.CanvasTexture(rc);
  const pulses=[0,1,2].map(k=>{ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:ringTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0})); scene.add(s); return {s,k}; });
  let lastPulse=-1;

  const sp=new Float32Array(1200*3); for(let i=0;i<sp.length;i++) sp[i]=(Math.random()-.5)*140;
  const sg=new THREE.BufferGeometry(); sg.setAttribute("position",new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:INK2,size:.12,transparent:true,opacity:.6})));

  const sats=STOPS.map((m,i)=>{
    const radius=2.5+i*.48, pivot=new THREE.Group(); pivot.rotation.set((Math.random()-.5)*.9,0,(Math.random()-.5)*.7); tilt.add(pivot);
    const pts=[]; for(let a=0;a<=128;a++){ const t=a/128*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(t)*radius,0,Math.sin(t)*radius)); }
    const ringMat=new THREE.LineBasicMaterial({color:LINE.clone(),transparent:true,opacity:.55});
    pivot.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),ringMat));
    const sat=new THREE.Group(); pivot.add(sat);
    sat.add(new THREE.Mesh(new THREE.OctahedronGeometry(.1),new THREE.MeshBasicMaterial({color:INK})));
    const g=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,depthWrite:false,blending:THREE.AdditiveBlending})); g.scale.set(.9,.9,1); sat.add(g);
    const hit=new THREE.Mesh(new THREE.SphereGeometry(.4,8,8),new THREE.MeshBasicMaterial({visible:false})); hit.userData.i=i; sat.add(hit);
    return { m,i,pivot,sat,hit,ringMat,radius,angle:Math.random()*Math.PI*2,speed:(.32/(1+i*.35))*(REDUCED?.2:1),slow:1 };
  });

  let fly=null, focusSat=null, away=false, hover=null;
  function tween(toPos,toLook,dur){ return new Promise(res=>{ if(fly) fly.res(); fly={t:0,dur,from:cam.position.clone(),to:toPos.clone(),lf:look.clone(),lt:toLook.clone(),res}; }); }
  ORBIT.focus=(i,dur=1)=>{ const s=sats[i]; if(!s) return Promise.resolve(); focusSat=s; away=true;
    const t=new THREE.Vector3(); s.sat.getWorldPosition(t);
    const pos=t.clone().add(t.clone().normalize().multiplyScalar(2.6)).add(new THREE.Vector3(0,.8,0));
    return tween(pos,t,dur); };
  ORBIT.home=(dur=1.3)=>{ focusSat=null; if(!away) return Promise.resolve(); away=false; return tween(HOME,ORIGIN,dur); };

  function resize(){
    const w=cv.clientWidth,h=cv.clientHeight; renderer.setSize(w,h,false); cam.aspect=w/h;
    if (w>760) cam.setViewOffset(w,h,w*.2,0,w,h); else cam.clearViewOffset();
    HOME.set(0, w>760?1.6:-1.2, w>760?8.2:11.5); if(!fly && !away) cam.position.copy(HOME);
    cam.updateProjectionMatrix();
  }
  addEventListener("resize",resize);

  const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), par=new THREE.Vector2(); const hits=sats.map(s=>s.hit);
  addEventListener("pointermove", e=>{
    par.set(e.clientX/innerWidth-.5, e.clientY/innerHeight-.5);
    if (e.target!==cv || touring){ setHover(null); return; }
    const r=cv.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mouse,cam); const h=ray.intersectObjects(hits)[0];
    setHover(h?sats[h.object.userData.i]:null, e.clientX-r.left, e.clientY-r.top);
  });
  function setHover(s,x,y){
    if (s && s!==hover) SFX.tone(1800,.03,.02);
    hover=s; cv.style.cursor = s ? "pointer" : "";
    if (!s){ label.style.opacity=0; return; }
    label.innerHTML=`<b>${esc(s.m.name)}</b><span>${esc(s.m.metric)}</span>, tap to open`;
    label.style.left=x+"px"; label.style.top=y+"px"; label.style.opacity=1;
  }
  cv.addEventListener("click", e=>{
    const r=cv.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mouse,cam); const h=ray.intersectObjects(hits)[0]; const s=h?sats[h.object.userData.i]:hover;
    if (!s || touring) return; setHover(null); $("#hint").classList.add("off");
    SFX.tone(440,.3,.05,"triangle",880); openApp(STOPS[s.i].open);
    ORBIT.focus(s.i,.9);
  });

  const clock=new THREE.Clock(); const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; let T=0;
  resize();
  (function loop(){
    requestAnimationFrame(loop); if (document.hidden) return;
    const dt=Math.min(clock.getDelta(),.05); T+=dt;
    planet.rotation.y += dt*(REDUCED?.02:.08);
    if (!away && !fly){ world.rotation.y += (par.x*.35-world.rotation.y)*.04; world.rotation.x += (par.y*.2-world.rotation.x)*.04; }
    if (!REDUCED){ const cyc=T*.22; pulses.forEach(({s,k})=>{ const t=(cyc+k/3)%1; const sc=R*2.1+t*R*4.4; s.scale.set(sc,sc,1); s.material.opacity=(1-t)*.28; });
      const n=Math.floor(T*.22*3); if(n!==lastPulse){ lastPulse=n; if(!cur && !touring) SFX.ping(); } }
    for(const s of sats){
      const want = focusSat===s ? .03 : hover===s ? .08 : 1;
      s.slow += (want-s.slow)*.1; s.angle += dt*s.speed*s.slow;
      s.sat.position.set(Math.cos(s.angle)*s.radius,0,Math.sin(s.angle)*s.radius);
      s.sat.rotation.y += dt*2;
      const big = hover===s||focusSat===s; s.sat.scale.setScalar(focusSat===s?1.3:big?1.8:1);
      s.ringMat.color.copy(big?AMBER:LINE); s.ringMat.opacity=big?.9:.55;
    }
    if (fly){
      fly.t += dt/fly.dur; const k=ease(Math.min(fly.t,1));
      cam.position.lerpVectors(fly.from,fly.to,k); look.lerpVectors(fly.lf,fly.lt,k);
      if (fly.t>=1){ const r=fly.res; fly=null; r(); }
    }
    cam.lookAt(look); renderer.render(scene,cam);
  })();
}

function drawChart(root){
  const ch=C.impact.chart, pts=ch.points, W=660,H=240,P={l:40,r:8,t:10,b:26}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const AM=tok("--amber"), GRID=tok("--line"), MUTED=tok("--muted");
  const max=Math.max(...pts.map(p=>p[1])), step=Math.pow(10,Math.floor(Math.log10(max))), top=Math.ceil(max/step)*step;
  const bw=iw/pts.length, barW=Math.max(6,bw-6), y=v=>P.t+ih-(v/top)*ih; let g="";
  for(let i=0;i<=4;i++){ const v=top*i/4,yy=y(v); g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="${GRID}"/><text x="${P.l-8}" y="${yy+4}" text-anchor="end" fill="${MUTED}" font-size="10" font-family="JetBrains Mono">${Math.round(v)}</text>`; }
  pts.forEach(([lab,v],i)=>{ const x=P.l+i*bw+(bw-barW)/2, yy=y(v), h=P.t+ih-yy, r=Math.min(4,h);
    g+=`<path d="M${x},${P.t+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+barW-r} Q${x+barW},${yy} ${x+barW},${yy+r} V${P.t+ih} Z" fill="${AM}" data-bar="${i}"/>`;
    g+=`<rect x="${P.l+i*bw}" y="${P.t}" width="${bw}" height="${ih}" fill="transparent" data-hit="${i}"/>`;
    g+=`<text x="${P.l+i*bw+bw/2}" y="${H-8}" text-anchor="middle" fill="${MUTED}" font-size="10" font-family="JetBrains Mono">${esc(lab)}</text>`; });
  const box=root.querySelector(".chart"), tip=root.querySelector(".tip");
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ch.title)}">${g}</svg>`;
  box.addEventListener("pointermove", e=>{ const hit=e.target.closest("[data-hit]");
    box.querySelectorAll("[data-bar]").forEach(b=>b.style.opacity = hit ? (b.dataset.bar===hit.dataset.hit?1:.45) : 1);
    if(!hit){ tip.style.opacity=0; return; } const [lab,v]=pts[+hit.dataset.hit], r=root.querySelector(".chartbox").getBoundingClientRect();
    tip.innerHTML=`${esc(lab)}: <b>${v.toLocaleString()}</b> ${esc(ch.unit)}`; tip.style.left=(e.clientX-r.left)+"px"; tip.style.top=(e.clientY-r.top)+"px"; tip.style.opacity=1; });
  box.addEventListener("pointerleave",()=>{ tip.style.opacity=0; box.querySelectorAll("[data-bar]").forEach(b=>b.style.opacity=1); });
  const tbl=root.querySelector(".tbl");
  tbl.innerHTML=`<table><tr><th>Month</th><th>${esc(ch.unit)}</th></tr>${pts.map(p=>`<tr><td>${esc(p[0])}</td><td>${p[1].toLocaleString()}</td></tr>`).join("")}</table>`;
  root.querySelector("[data-act='table']").onclick=e=>{ tbl.hidden=!tbl.hidden; e.target.textContent=tbl.hidden?"Show table":"Hide table"; };
}

  const run=n=>{ try{ out.textContent=JSON.stringify(JSON.parse(ta.value),null,n); out.classList.remove("err"); }catch(e){ out.textContent="Invalid JSON: "+e.message; out.classList.add("err"); } };

  a.oninput=b.oninput=upd; upd(); }
function initTerminal(root){
  const log=root.querySelector(".log"),inp=root.querySelector("input"),term=root.querySelector(".term"),hist=[]; let hi=0;
  const print=(cmd,txt)=>{ log.insertAdjacentHTML("beforeend",`${cmd!=null?`<div><span class="p">$</span> ${esc(cmd)}</div>`:""}<div class="o">${txt}</div>`); term.scrollTop=term.scrollHeight; };
  const CMDS={
    help:()=>"commands: whoami, ls, open &lt;section&gt;, tour, projects, contact, anomaly, launch, clear, sudo hire-me",
    whoami:()=>`${esc(C.name)}, ${esc(C.role)}`,
    ls:()=>[...NAV,"workbench"].join("  "),
    projects:()=>C.projects.length?C.projects.map((m,i)=>`${i+1}. ${esc(m.name)}: ${esc(m.result||"")}`).join("\n"):"no projects added yet",
    contact:()=>`email: ${esc(C.contact.email)}`,
    open:a=>(APPS[a[0]] && HAS[a[0]]!==false)?(setTimeout(()=>openApp(a[0]),300),`opening ${esc(a[0])}`):`no section "${esc(a[0]||"")}", try: ls`,
    tour:()=>(setTimeout(tour,300),"starting tour"),
    anomaly:()=>(setTimeout(()=>{ closePanel(); triggerAnomaly(); },300),"injecting anomaly"),
    launch:()=>(setTimeout(replay,400),"T-minus 10"),
    sudo:a=>a[0]==="hire-me"?(setTimeout(()=>openApp("contact"),400),"permission granted, opening channel"):"sudo: permission denied",
    clear:()=>(log.innerHTML="",null),
  };
  print(null,`Type <span style="color:var(--amber)">help</span>.`);
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp"&&hist.length){ hi=Math.max(0,hi-1); inp.value=hist[hi]; e.preventDefault(); return; }
    if(e.key==="ArrowDown"&&hist.length){ hi=Math.min(hist.length,hi+1); inp.value=hist[hi]||""; e.preventDefault(); return; }
    if(e.key!=="Enter") return; const raw=inp.value.trim(); inp.value=""; if(!raw) return; hist.push(raw); hi=hist.length;
    const [c,...args]=raw.split(/\s+/), fn=CMDS[c.toLowerCase()], r=fn?fn(args):`command not found: ${esc(c)}, type help`; if(r!==null) print(raw,r); SFX.tone(1400,.04,.03);
  });
  term.addEventListener("click",()=>inp.focus()); setTimeout(()=>inp.focus(),80);
}

   HIDDEN COMMAND BAR (Ctrl or Cmd + K)
   ===================================================================== */
const pal=$("#pal"), palIn=$("#palIn"), palList=$("#palList"); let palSel=0, palItems=[];
const commands=()=>[
  {icon:"play",label:"Take the tour",kind:"action",run:tour},
  ...[...NAV,"workbench"].map(id=>({icon:APPS[id].icon,label:"Open "+APPS[id].title,kind:"section",run:()=>openApp(id)})),
  ...Object.entries(APPS).filter(([,a])=>a.tool).map(([id,a])=>({icon:a.icon,label:"Run "+a.title,kind:"tool",run:()=>openApp(id)})),
  ...C.projects.map((m,i)=>({icon:"rocket",label:"Project: "+m.name,kind:"project",run:()=>openApp("project"+i)})),
  {icon:"copy",label:"Copy email",kind:"action",run:()=>copy(C.contact.email,"Email copied")},
  {icon:"alert",label:"Trigger anomaly",kind:"easter egg",run:()=>{ closePanel(); triggerAnomaly(); }},
  {icon:"rocket",label:"Replay launch",kind:"action",run:replay},
];
function openPal(){ pal.classList.add("on"); palIn.value=""; palSel=0; renderPal(); palIn.focus(); }
function closePal(){ pal.classList.remove("on"); }
function renderPal(){ const q=palIn.value.toLowerCase().trim();
  palItems=commands().filter(c=>!q||q.split(/\s+/).every(w=>c.label.toLowerCase().includes(w)||c.kind.includes(w)));
  palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  palList.innerHTML=palItems.length?palItems.map((c,i)=>`<li class="${i===palSel?"sel":""}" data-i="${i}">${ic(c.icon)}<span>${esc(c.label)}</span><span>${c.kind}</span></li>`).join(""):`<li>No command found</li>`; }
palIn.addEventListener("input",()=>{ palSel=0; renderPal(); });
palIn.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){ palSel=(palSel+1)%Math.max(1,palItems.length); renderPal(); e.preventDefault(); }
  if(e.key==="ArrowUp"){ palSel=(palSel-1+palItems.length)%Math.max(1,palItems.length); renderPal(); e.preventDefault(); }
  if(e.key==="Enter"&&palItems[palSel]){ closePal(); palItems[palSel].run(); } });
palList.addEventListener("click",e=>{ const li=e.target.closest("[data-i]"); if(li){ closePal(); palItems[+li.dataset.i].run(); } });
pal.addEventListener("click",e=>{ if(e.target===pal) closePal(); });
addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); pal.classList.contains("on")?closePal():openPal(); return; }
  if(e.key==="Escape"){ if(pal.classList.contains("on")) closePal(); else if(touring) endTour(); else closePanel(); }
  const typing=/INPUT|TEXTAREA/.test(document.activeElement?.tagName);
  if(cur && !typing && e.key==="ArrowRight") step(1);
  if(cur && !typing && e.key==="ArrowLeft") step(-1);
});

/* =====================================================================
   ANOMALY: "Houston, we have a problem"
   ===================================================================== */
const ANOMALY={ first:45000, every:180000 };
const ANOMALY_MSGS=["Recruiter has not contacted pilot.","Hiring manager still scrolling. Fuel running low.","Strong candidate drifting out of range.","Pilot's inbox detected as dangerously empty."];
let anomalyTimer, anomalyDone=false, anomalyN=0; const alertEl=$("#alert"), osEl=$("#os");
$("#alertH").innerHTML=`${ic("alert")}Houston, we have a problem`;
function scheduleAnomaly(ms){ clearTimeout(anomalyTimer); if(anomalyDone) return; anomalyTimer=setTimeout(()=>{ (cur==="contact"||touring)?scheduleAnomaly(30000):triggerAnomaly(); },ms); }
function triggerAnomaly(){
  $("#alertMsg").textContent=ANOMALY_MSGS[anomalyN++%ANOMALY_MSGS.length];
  $("#alertProb").textContent=`Chance of missing a great hire: ${(94+Math.random()*5.9).toFixed(1)}%`;
  alertEl.classList.add("on"); osEl.classList.add("redalert"); SFX.siren(); }
function clearAnomaly(){ alertEl.classList.remove("on"); osEl.classList.remove("redalert"); }
$("#alertFix").onclick=()=>{ clearAnomaly(); anomalyDone=true; clearTimeout(anomalyTimer); openApp("contact"); toast("Anomaly resolved. Thank you, commander."); };
$("#alertIgnore").onclick=()=>{ clearAnomaly(); scheduleAnomaly(ANOMALY.every); toast("Anomaly ignored. Bold move."); };

/* =====================================================================
   LAUNCH
   ===================================================================== */
const BOOT=[
  `mission control v3`,
  `[ <span class="ok">ok</span> ] ${STOPS.length} satellites in orbit`,
  `[ <span class="ok">ok</span> ] fuel 100%, coffee 100%`,
  `[ <span class="ok">ok</span> ] pilot on board: ${esc(C.name)}`,
];
const warp={speed:.003,target:.003,run:true};
function runWarp(){
  const cv=$("#warp"),x=cv.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2); let W,H;
  const VOID=tok("--void"), STAR="232,237,243", HOT="255,214,150";
  const S=Array.from({length:520},()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random()}));
  const size=()=>{ W=cv.width=innerWidth*dpr; H=cv.height=innerHeight*dpr; }; size(); addEventListener("resize",size);
  (function f(){ if(!warp.run) return; warp.speed+=(warp.target-warp.speed)*.06;
    x.globalAlpha = warp.speed>.05?.18:.4; x.fillStyle=VOID; x.fillRect(0,0,W,H); x.globalAlpha=1;
    for(const s of S){ const pz=s.z; s.z-=warp.speed; if(s.z<=.02){ s.x=(Math.random()-.5)*2; s.y=(Math.random()-.5)*2; s.z=1; continue; }
      const k=Math.max(W,H)*.5,sx=W/2+s.x/s.z*k,sy=H/2+s.y/s.z*k,px=W/2+s.x/pz*k,py=H/2+s.y/pz*k;
      x.strokeStyle=`rgba(${warp.speed>.05?HOT:STAR},${(1-s.z)*.9})`; x.lineWidth=(1-s.z)*2.2*dpr; x.beginPath(); x.moveTo(px,py); x.lineTo(sx,sy); x.stroke(); }
    requestAnimationFrame(f); })();
}
let booted=false, launching=false; const bootEl=$("#boot");
$("#launch").innerHTML=`${ic("rocket")}Tap to launch`;
$("#soundNote").innerHTML=`${ic("headphones")}Sound on for the full experience`;
function finishBoot(){
  if(booted) return; booted=true;
  bootEl.classList.remove("shake"); bootEl.classList.add("gone");
  try{ sessionStorage.setItem("launched","1"); }catch{}
  setTimeout(()=>{ warp.run=false; bootEl.remove(); },700);
  revealHome(); scheduleAnomaly(ANOMALY.first);
}
function runBoot(){
  runWarp(); const logEl=$("#bootlog");
  logEl.innerHTML=BOOT.map(l=>`<div class="ln">${l}</div>`).join(""); const lines=[...logEl.children];
  lines.forEach((l,i)=>setTimeout(()=>l.classList.add("on"),250+i*240));
  setTimeout(()=>{ $("#launchRow").classList.add("on"); $("#launch").focus(); },300+lines.length*240);
}
async function launch(){
  if(launching||booted) return; launching=true; SFX.unlock();
  $("#bootlog").classList.add("hide"); $("#launchRow").classList.add("hide");
  const cnt=$("#count");
  for(let n=10;n>=1;n--){ if(booted) return;
    cnt.innerHTML=`<div><small>T-minus</small>${n}</div>`; SFX.beep(n<=3?1320:880);
    if(n===5) SFX.rumble(2.6); if(n===3) bootEl.classList.add("shake");
    warp.target = n<=3 ? .03 : .004+(10-n)*.0018; await wait(470); }
  if(booted) return;
  cnt.innerHTML=`<div class="lift">Liftoff</div>`; warp.target=.2; await wait(900);
  const fl=$("#flash"); fl.style.transition="none"; fl.style.opacity=1; finishBoot();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ fl.style.transition="opacity 1.1s ease-out"; fl.style.opacity=0; }));
}
function replay(){ try{ sessionStorage.removeItem("launched"); }catch{} location.reload(); }
$("#launch").onclick=launch;
$("#skip").onclick=finishBoot;

buildHome(); tick(); setInterval(tick,15000); initOrbit();
let seen=false; try{ seen=sessionStorage.getItem("launched")==="1"; }catch{}
if (new URLSearchParams(location.search).has("launch")) seen=false;
if (seen||REDUCED) finishBoot(); else runBoot();
</script>
</body>
